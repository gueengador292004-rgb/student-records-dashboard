<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Records Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>🎓 Student Records Dashboard</h1></header>
  <main>
    <section class="cards">
      <div class="card"><span>Total Students</span><strong id="sTotal">0</strong></div>
      <div class="card"><span>Average Grade</span><strong id="sAvg">0</strong></div>
      <div class="card"><span>Top Grade</span><strong id="sTop">0</strong></div>
      <div class="card warn"><span>At Risk (&lt;75)</span><strong id="sRisk">0</strong></div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Add Student</h2>
      <form id="studentForm">
        <input type="hidden" id="id">
        <input id="name" placeholder="Full name" required>
        <input id="course" placeholder="Course" value="General">
        <input id="year_level" type="number" min="1" max="6" placeholder="Year level" required>
        <input id="grade" type="number" step="0.1" min="0" max="100" placeholder="Grade (0-100)" required>
        <button type="submit" id="saveBtn">Add</button>
        <button type="button" id="cancelBtn" class="secondary" hidden>Cancel</button>
      </form>
      <p id="error" class="error"></p>
    </section>

    <section class="panel">
      <div class="row">
        <h2>Students</h2>
        <input id="search" placeholder="Search name or course...">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Year</th><th>Grade</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
